<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TUP Clinic EHR</title>
  <meta name="theme-color" content="#8C1515" />
  <meta name="apple-mobile-web-app-title" content="TUP Clinic EHR" />
  <link rel="manifest" href="/manifest.json">
  <!-- Each portal's own icon; Vite fills in the surface from the build mode (.env.<mode>). -->
  <link rel="icon" type="image/png" href="/icons/portal-%VITE_DEPLOY_SURFACE%.png" />
  <link rel="apple-touch-icon" href="/icons/portal-%VITE_DEPLOY_SURFACE%-180.png" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('tup-clinic-theme') || localStorage.getItem('ehr_theme');
        if (!saved) {
          var settingsRaw = localStorage.getItem('clinic-settings');
          if (settingsRaw) {
            var parsed = JSON.parse(settingsRaw);
            if (parsed && typeof parsed.theme === 'string') saved = parsed.theme;
          }
        }
        var theme = (saved === 'dark' || saved === 'light')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);

        var density = localStorage.getItem('tup-clinic-density') || 'normal';
        if (density === 'compact' || density === 'comfortable') {
          document.documentElement.setAttribute('data-density', density);
        } else {
          document.documentElement.setAttribute('data-density', 'normal');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
