<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TUP Clinic EHR</title>
  <script>
    // Single Page App Fallback: Redirect deep links and recovery hashes to index.html
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    window.location.replace('/' + (path.startsWith('/') ? path.slice(1) : path) + search + hash);
  </script>
</head>
<body>
  <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #64748b;">
    Redirecting to TUP Clinic EHR...
  </div>
</body>
</html>
