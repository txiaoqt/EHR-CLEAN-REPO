<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TUP Clinic EHR</title>
  <meta name="theme-color" content="#8C1515" />
  <meta name="apple-mobile-web-app-title" content="TUP Clinic EHR" />
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('tup-clinic-theme') || localStorage.getItem('ehr_theme');
        if (!saved) {
          var settingsRaw = localStorage.getItem('clinic-settings');
          if (settingsRaw) {
            var parsed = JSON.parse(settingsRaw);
            if (parsed && typeof parsed.theme === 'string') saved = parsed.theme;
          }
        }
        var theme = (saved === 'dark' || saved === 'light')
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <script type="module" crossorigin src="/assets/index-BXmrVzn9.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CSKoPgVz.css">
<link rel="manifest" href="/manifest.webmanifest"></head>

</body>
</html>
